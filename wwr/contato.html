<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | Queda D'Água Rafting</title>
    <meta name="description"
      content="Entre em contato com a Queda D'Água Rafting. Tire suas dúvidas, envie sugestões ou reserve sua próxima aventura.">
    <meta name="author" content="Jorge Farias">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>
        <img src="imagens/logo.png" alt="Logo Queda D'Água Rafting" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- SEÇÃO SUPERIOR: TÍTULO E CONTATOS DA SUA EMPRESA -->
        <section class="topo-contato">
            <h1>Queda D'Água Rafting</h1>
            <address class="informacoes-contato">
                <p> Rua Ecologica,s/n</p>
                <p>Batatais, SÃO PAULO</p>
                <p>+55 11 99999-9999</p>
                <p>info@quedadagua.com</p>
            </address>
        </section>

        <!-- SEÇÃO PRINCIPAL (MAPA À ESQUERDA + FORMULÁRIO À DIREITA) -->
        <section class="contato-container">

            <div class="mapa-coluna">
                <iframe class="mapa-iframe"
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3600.089852899478!2d-54.585421!3d-25.539821!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjXCsDMyJzIzLjMiUyA1NMKwMzUnMDcuNSJX!5e0!3m2!1spt-BR!2sbr!4v1620000000000!5m2!1spt-BR!2sbr"
                  width="600" height="300" style="border:0; width:100%;" allowfullscreen
                  loading="lazy"></iframe>
            </div>

            <div class="form-coluna">
                <form action="#" method="post" class="form-contato">
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite aqui" required>
                    </div>

                    <div class="campo">
                        <label for="email">e-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite aqui"
                          required>
                    </div>

                    <div class="campo campo-radio">
                        <span class="label-fake">Propósito da Mensagem</span>
                        <div class="opcoes-radio">
                            <label><input type="radio" name="proposito" value="geral" checked>
                                Dúvida Geral</label>
                            <label><input type="radio" name="proposito" value="reserva"> Pergunta
                                sobre Reservas</label>
                            <label><input type="radio" name="proposito" value="sugestao">
                                Sugestão</label>
                        </div>
                    </div>

                    <div class="campo campo-textarea">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" placeholder="Digite aqui" rows="4"
                          required></textarea>
                    </div>

                    <div class="campo-checkbox">
                        <label>
                            <input type="checkbox" name="newsletter" value="sim"> Por favor, me
                            inscreva na newsletter mensal
                        </label>
                    </div>

                    <button type="submit" class="btn-enviar">Entrar em Contato!</button>
                </form>
            </div>
        </section>
        <section class="equipe-secao">
            <h2>Nossa Equipe</h2>
            <div class="equipe-cards"> <!-- ESSA DIV PRECISA EXISTIR -->
                <figure>
                    <img src="imagens/ceo.jpg" alt="imagem CEO">
                    <figcaption>João - ceo</figcaption>
                </figure>
                <figure>
                    <img src="imagens/gerente.jpg" alt="imagem Gerente">
                    <figcaption>Maria - Gerente</figcaption>
                </figure>
                <figure>
                    <img src="imagens/vendedora.jpg" alt="imagem Vendedora">
                    <figcaption>Sandra - Vendedora</figcaption>
                </figure>
            </div>
        </section>
        <!-- RODAPÉ -->
        <footer>
            <p>&copy; 2026| Queda D'Água Rafting | Jorge Farias</p>
            <nav class="socialmedia">
                <a href="https://facebook.com" target="_blank">
                    <img src="imagens/face.png" alt="Facebook"></a>
                <a href="https://instagram.com" target="_blank">
                    <img src="imagens/insta.png" alt="Instagram"></a>
                <a href="https://linkedin.com" target="_blank">
                    <img src="imagens/linke.png" alt="LinkedIn"></a>
            </nav>
        </footer>
    </main>
</body>

</html>
